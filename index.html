<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIRT Connect - Age Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Background Video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Overlay gelap agar teks terbaca jelas */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* Header Logo */
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo-icon {
            font-size: 18px;
            margin-right: 6px;
        }

        .logo-text {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -0.5px;
            color: #111;
            line-height: 1.1;
        }

        .logo-text span {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: #555;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            padding: 0 20px;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 340px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            color: #111111;
            background: linear-gradient(135deg, #ffd26f 0%, #ff9853 50%, #b172ff 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, opacity 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        /* Cookie Banner */
        .cookie-banner {
            width: 92%;
            max-width: 420px;
            background: #ffffff;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .cookie-text {
            font-size: 13px;
            color: #333333;
            line-height: 1.4;
        }

        .cookie-text a {
            color: #f39c12;
            text-decoration: none;
        }

        .cookie-btn {
            align-self: flex-end;
            background-color: #ffbc00;
            color: #111;
            border: none;
            padding: 10px 22px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cookie-btn:hover {
            background-color: #e0a500;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Background Video 4.mp4 -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="4.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>
    <div class="overlay"></div>

    <!-- Header Logo -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">💕 </div>
            <div class="logo-text">
                FLIRT
                <span>Connect</span>
            </div>
        </div>
    </header>

    <!-- Main Content / Verifikasi Usia -->
    <div class="main-content">
        <h1>What is your age?</h1>
        <div class="btn-container">
            <a href="https://safeoffers.pro/a/82XZjfkKqF2YwQ" class="btn">Under 20</a>
            <a href="https://safeoffers.pro/a/82XZjfkKqF2YwQ" class="btn">Over 21</a>
        </div>
    </div>

    <!-- Cookie Banner -->
    <div class="cookie-banner" id="cookieBanner">
        <div class="cookie-text">
            This website uses cookies to ensure you get the best experience on our website. <a href="#">Learn more</a>
        </div>
        <button class="cookie-btn" onclick="acceptCookies()">Got it!</button>
    </div>

    <script>
        function acceptCookies() {
            document.getElementById('cookieBanner').classList.add('hidden');
        }
    </script>
</body>
</html>
