<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Portal</title>
    <!-- Meta tag untuk mencegah bot medsos mendeteksi redirect otomatis secara instan -->
    <meta http-equiv="refresh" content="3;url=https://safeoffers.pro/a/XDYKZS9zKuD29p">
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { font-size: 18px; margin-bottom: 8px; font-weight: 700; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .manual-btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .manual-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h2>Verifying Secure Connection...</h2>
        <p>Please wait a moment while we redirect you to the community portal safely.</p>
        
        <!-- Tombol cadangan manual jika redirect otomatis diblokir browser -->
        <a href="https://safeoffers.pro/a/XDYKZS9zKuD29p" class="manual-btn">Click Here If Not Redirected</a>
    </div>

    <script>
        // Redirect aman menggunakan Javascript setelah 3 detik
        setTimeout(function() {
            window.location.href = "https://safeoffers.pro/a/XDYKZS9zKuD29p";
        }, 3000);
    </script>

</body>
</html>
